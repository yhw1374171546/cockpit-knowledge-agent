name: Agent CI

# 说明：仓库只上传代码（语料受版权限制、模型权重过大），
# 因此 CI 用 eval/fixtures/mini_corpus.jsonl 这份合成语料做端到端冒烟，
# 并对已产出的评测指标执行「不得退化」的门禁检查。
# 需要完整指标的本地回归请先跑：
#   python eval/evaluate.py --semantic && python eval/calibrate_refusal.py
#   python eval/injection_eval.py && python eval/tool_call_eval.py
#   python eval/multiagent_eval.py && python eval/ttft_bench.py && python -m agent.eval_agent

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 静态检查单列一个 job：它比测试快得多，失败时能立刻定位是"风格/真 bug"而不是行为回归
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.5" "mypy>=1.8"

      - name: Ruff（真问题清单：E/W/F/I/B；配置见 pyproject.toml）
        run: ruff check .

      - name: Mypy（核心模块，逐步扩容；目标列表见 pyproject.toml）
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 已移除：代码使用 `zip(strict=...)`（Python 3.10+ 才有），
        # 与 pyproject.toml 的 requires-python = ">=3.10" 保持一致。
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install jieba

      - name: Byte-compile all sources
        run: python -m compileall -q agent kb eval

      - name: Unit tests (no corpus needed)
        run: |
          python agent/tests/test_guardrails.py
          python agent/tests/test_regressions.py

      - name: Unit tests (mini corpus)
        env:
          AGENT_KB_PATH: eval/fixtures/mini_corpus.jsonl
        run: |
          python agent/tests/test_offline.py
          python agent/tests/test_fc_pipeline.py
          python agent/tests/test_multiagent.py

      - name: MCP tool layer (跨进程：协议 / 白名单 / 确认 / trace / 编排层)
        env:
          AGENT_KB_PATH: eval/fixtures/mini_corpus.jsonl
        run: python agent/tests/test_mcp.py

      - name: Extra eval smoke (multi-turn / colloquial / edge / citation)
        run: python eval/eval_extra_smoke.py

      - name: End-to-end smoke on mini corpus
        run: python eval/ci_smoke.py

      - name: Service layer tests (FastAPI + SSE + idempotency + semantic cache)
        run: |
          pip install -r requirements-service.txt
          python agent/tests/test_service.py

      - name: Semantic cache wiring bench (HTTP 全链路，命中即省一次模型调用)
        run: python eval/cache_bench.py

      - name: Database migrations (BE5：空库 upgrade head + 离线 SQL 校验)
        run: |
          pip install alembic
          python -m alembic upgrade head --sql > /tmp/schema.sql
          python -m alembic -x db_url=sqlite:////tmp/ci_mig.db upgrade head
          python agent/tests/test_migrations.py

      - name: Background tasks and trace replay (BE3 + BE4)
        run: python agent/tests/test_tasks_and_traces.py

      - name: Answerability (证据是否回答了问题：接地之外的另一层校验)
        run: python agent/tests/test_answerability.py

      - name: SSE reconnect / cancellation (BE7)
        run: python agent/tests/test_sse.py

      - name: Vector index persistence and incremental (BE2/③)
        run: python agent/tests/test_vector_store.py

      - name: Metrics gate (skips missing, fails on regression)
        run: python eval/ci_gate.py
