# Grafana 数据源与看板自动装载（基础设施即代码：看板也进版本库）
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 10s

providers:
  - name: cockpit-agent
    orgId: 1
    folder: "座舱 Agent"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
